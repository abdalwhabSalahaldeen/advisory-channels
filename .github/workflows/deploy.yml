# Tests every push to main, then uploads the release to the cPanel hosting over FTP.
#
# The deploy job stays off until these are set in GitHub:
#   Settings → Secrets and variables → Actions
#     Variables: SITE_URL, FTP_SERVER, FTP_USERNAME, APP_FOLDER, FTP_APP_DIR, FTP_WEB_DIR
#     Secrets:   FTP_PASSWORD, DEPLOY_TOKEN (the same value as DEPLOY_TOKEN in the server's .env)
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, fileinfo, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: tests
    if: ${{ vars.FTP_SERVER != '' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: ${{ github.workspace }}/storage/framework/releases/github
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, fileinfo, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the release
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan app:package-for-cpanel --update --app-folder="${{ vars.APP_FOLDER }}" --directory="$RELEASE_DIR"

      # .env and storage/ (settings, uploads, logs, sessions) on the server are never touched.
      - name: Upload the application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.RELEASE_DIR }}/${{ vars.APP_FOLDER }}/
          server-dir: ${{ vars.FTP_APP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            storage/**

      - name: Upload the public files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.RELEASE_DIR }}/public_html/
          server-dir: ${{ vars.FTP_WEB_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            storage
            storage/**

      - name: Update the database and clear caches
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ vars.SITE_URL }}/deploy/hook"
